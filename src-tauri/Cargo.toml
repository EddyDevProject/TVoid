[package]
name = "tvoid"
version = "0.1.0"
edition = "2021"
description = "Declutter Android TV and Google TV over Wi-Fi ADB"
license = "MIT"

[lib]
name = "tvoid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adb_client = "3.2"
regex = "1"
once_cell = "1"
rsa = { version = "0.9", features = ["pem"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
